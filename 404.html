<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      try {
        var t = localStorage.getItem('annalesdnb-theme');
        if (t === 'dark' || t === 'light') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page introuvable — AnnalesDNB</title>
  <link rel="stylesheet" href="assets/css/main.css">
  <link rel="stylesheet" href="assets/css/chatbot.css">
  <style>
    .error-page {
      max-width: 480px;
      margin: var(--space-16) auto;
      padding: 0 var(--space-4);
      text-align: center;
    }
    .error-page__code {
      font-size: 4rem;
      font-weight: 700;
      color: var(--color-marine);
      margin: 0;
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-header__brand" href="/">
        <img class="site-header__logo" src="assets/img/logo-rf.svg" alt="" width="36" height="30">
        <span class="site-header__title-group">
          <span class="site-header__title">AnnalesDNB</span>
          <span class="site-header__tagline">Toutes les épreuves du Brevet 2020–2026</span>
        </span>
      </a>
      <button type="button" id="theme-toggle" class="theme-toggle" aria-pressed="false" aria-label="Passer en mode sombre">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="error-page">
    <p class="error-page__code">404</p>
    <h1>Page introuvable</h1>
    <p>La page que tu cherches n'existe pas ou plus.</p>
    <p><a class="btn btn--primary" href="index.html">Retour au catalogue des annales</a></p>
  </main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>Site non officiel. Sources : APMEP, PrépaDNB, Académies, L'Étudiant.</p>
    </div>
  </footer>

  <script type="module" src="assets/js/chatbot.js"></script>
  <script type="module" src="assets/js/theme.js"></script>
</body>
</html>
